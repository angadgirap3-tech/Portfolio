<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="brand" href="index.html">Angad</a>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
          <button class="nav-toggle" type="button" aria-label="Toggle navigation">☰</button>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container page-content">
      <section class="card contact-wrap">
        <div>
          <h1>Contact Me</h1>
          <p>Use the form below to send a message. I'll get back to you as soon as possible!</p>
          <div id="form-success" style="display: none; margin-top: 1.5rem; padding: 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 12px; color: var(--text);">
            <strong>✅ Message sent successfully!</strong>
            <p style="margin: 0.5rem 0 0 0;">Thank you for reaching out. I'll respond to you shortly.</p>
          </div>
        </div>
        <form class="contact-form" name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/thank-you.html">
          <input type="hidden" name="form-name" value="contact" />
          <p style="display: none;">
            <label>Don't fill this out if you're human: <input name="bot-field" /></label>
          </p>
          <label>
            Name
            <input type="text" name="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Subject
            <input type="text" name="subject" required />
          </label>
          <label>
            Message
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button class="button primary" type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Angad. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
