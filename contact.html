<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="brand" href="index.html">Angad</a>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
          <button class="nav-toggle" type="button" aria-label="Toggle navigation">☰</button>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>

        </ul>
      </nav>
    </header>

    <main class="container page-content">
      <section class="card contact-wrap">
        <div>
          <h1>Contact Me</h1>
          <p>Use the form below to send a message. The page is ready to connect to your PHP mail handler.</p>
        </div>
        <form class="contact-form" action="php/contact.php" method="post">
          <label>
            Name
            <input type="text" name="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Subject
            <input type="text" name="subject" required />
          </label>
          <label>
            Message
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button class="button primary" type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Angad. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
